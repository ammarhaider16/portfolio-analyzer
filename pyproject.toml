[project]
name = "betafolio"
version = "0.1.0"
description = "Read-only portfolio research, a personal dashboard, and optional briefings"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "platformdirs>=4,<5",
  "exchange-calendars>=4.8,<5",
  "tzdata>=2025.1",
  "beautifulsoup4>=4.12,<5",
  "ddgs>=9,<10",
  "yfinance>=1.7,<2",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "langchain-anthropic>=1,<2",
  "openpyxl>=3.1,<4",
  "xlrd>=2,<3",
  "defusedxml>=0.7,<1",
  "markdown-it-py>=3,<5",
]

[project.scripts]
betafolio = "betafolio.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betafolio"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/examples", "/scripts",
  "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/Dockerfile", "/compose.yaml",
]
exclude = ["/docs/security-review*", "/docs/security-dependency-audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:Timestamp.utcnow is deprecated"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
